<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Hub - Gestão e Sincronização</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button.secondary { background: #64748b; }
        .status { font-size: 0.85em; margin-top: 10px; color: #64748b; }
        pre { background: #f1f5f9; padding: 15px; border-radius: 8px; overflow-x: auto; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1>Producer Hub</h1>
            <button id="auth-btn" onclick="handleDriveAuth()">Ligar Google Drive</button>
        </div>
        
        <div id="drive-status" class="status">Aguardando ligação ao Drive...</div>

        <hr>

        <h3>Dados do Projeto</h3>
        <p>Edita os valores abaixo para testar a sincronização automática:</p>
        <textarea id="data-input" style="width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" oninput="updateData(this.value)"></textarea>
        
        <div style="margin-top: 20px;">
            <button class="secondary" onclick="location.reload()">Atualizar Página (Testar Login)</button>
        </div>
    </div>
</div>

<!-- Modal para configurar Client ID se estiver vazio -->
<div id="modal-drive" class="modal">
    <div class="modal-content">
        <h3>Configuração Necessária</h3>
        <p>Por favor, insere o teu Google Client ID no código (variável GOOGLE_CLIENT_ID).</p>
        <button onclick="document.getElementById('modal-drive').classList.remove('show')">Fechar</button>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    // ============================================================
    // CONFIGURAÇÕES (SUBSTITUI PELO TEU ID)
    // ============================================================
    const GOOGLE_CLIENT_ID = 'COLOCA_AQUI_O_TEU_CLIENT_ID.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';

    // ============================================================
    // ESTADO DA APP
    // ============================================================
    let appData = { content: "Dados iniciais" };
    let accessToken = null;
    let isSignedIn = false;
    let tokenClient = null;
    let driveFileId = null;

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    window.onload = () => {
        // 1. Tentar recuperar dados locais
        const local = localStorage.getItem('producer_hub_data');
        if (local) {
            appData = JSON.parse(local);
            document.getElementById('data-input').value = appData.content;
        }

        // 2. Tentar recuperar login da sessão (Evita perder login no refresh)
        const savedToken = sessionStorage.getItem('drive_access_token');
        if (savedToken) {
            accessToken = savedToken;
            isSignedIn = true;
            updateDriveButton(true);
        }

        loadGoogleAPI();
    };

    function loadGoogleAPI() {
        if (typeof google !== 'undefined') {
            initGoogleAuth();
        } else {
            setTimeout(loadGoogleAPI, 100);
        }
    }

    function initGoogleAuth() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: SCOPES,
            callback: async (response) => {
                if (response.error) {
                    console.error(response.error);
                    return;
                }
                accessToken = response.access_token;
                sessionStorage.setItem('drive_access_token', accessToken);
                isSignedIn = true;
                updateDriveButton(true);
                await syncWithDrive();
            },
        });

        // Se já temos token, sincronizar automaticamente ao carregar
        if (isSignedIn) {
            syncWithDrive();
        }
    }

    function handleDriveAuth() {
        if (GOOGLE_CLIENT_ID.includes('COLOCA_AQUI')) {
            document.getElementById('modal-drive').classList.add('show');
            return;
        }
        
        if (isSignedIn && accessToken) {
            syncWithDrive();
        } else {
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }
    }

    function updateDriveButton(active) {
        const btn = document.getElementById('auth-btn');
        if (active) {
            btn.innerText = 'Sincronizar Agora';
            btn.style.background = '#059669';
        }
    }

    function updateData(val) {
        appData.content = val;
        localStorage.setItem('producer_hub_data', JSON.stringify(appData));
        
        // Debounce para não sobrecarregar a API da Google
        clearTimeout(window.saveTimeout);
        window.saveTimeout = setTimeout(() => {
            if (isSignedIn) syncWithDrive();
        }, 2000);
    }

    // ============================================================
    // LÓGICA GOOGLE DRIVE (CRUD)
    // ============================================================
    async function syncWithDrive() {
        document.getElementById('drive-status').innerText = '🔄 A sincronizar...';
        
        try {
            // 1. Procurar se o ficheiro já existe no Drive
            if (!driveFileId) {
                const response = await fetch('https://www.googleapis.com/drive/v3/files?q=name="producer-hub-data.json" and trashed=false', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const data = await response.json();
                
                if (data.files && data.files.length > 0) {
                    driveFileId = data.files[0].id;
                }
            }

            if (driveFileId) {
                // Atualizar ficheiro existente
                await uploadToDrive(driveFileId, 'PATCH');
                document.getElementById('drive-status').innerText = '✅ Sincronizado com o Drive';
            } else {
                // Criar novo ficheiro
                await uploadToDrive('', 'POST');
                document.getElementById('drive-status').innerText = '☁️ Ficheiro criado no Drive';
            }
        } catch (err) {
            document.getElementById('drive-status').innerText = '❌ Erro na sincronização';
            console.error(err);
        }
    }

    async function uploadToDrive(fileId, method) {
        const metadata = {
            name: 'producer-hub-data.json',
            mimeType: 'application/json'
        };

        const url = method === 'POST' 
            ? 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart'
            : `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`;

        const formData = new FormData();
        formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        formData.append('file', new Blob([JSON.stringify(appData)], { type: 'application/json' }));

        const response = await fetch(url, {
            method: method,
            headers: { 'Authorization': `Bearer ${accessToken}` },
            body: formData
        });
        
        const result = await response.json();
        if (method === 'POST') driveFileId = result.id;
    }
</script>

</body>
</html>
