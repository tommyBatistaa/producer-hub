<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Hub - Pro System</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { 
            --primary: #ffcc00; 
            --primary-glow: rgba(255, 204, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg: #0a0b10;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top right, #1a1c2c, var(--bg)); 
            color: #e0e0e0;
            margin: 0; 
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BARRA LATERAL */
        .sidebar { 
            width: 250px; 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px; 
            position: fixed; 
            height: 100vh;
            z-index: 100;
            box-sizing: border-box;
        }

        .sidebar h2 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; font-size: 1.1em; text-shadow: 0 0 10px var(--primary-glow); margin-bottom: 40px; }

        .nav-item { 
            cursor: pointer; 
            padding: 15px; 
            margin-bottom: 10px;
            border-radius: 10px;
            transition: 0.3s;
            border: 1px solid transparent;
            font-weight: bold;
            font-size: 0.9em;
        }

        .nav-item:hover, .nav-item.active { 
            background: var(--glass);
            border: 1px solid var(--primary);
            color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* ESTADO GOOGLE DRIVE NA SIDEBAR */
        .drive-status {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
        }

        .drive-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.85em;
            text-align: center;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .drive-btn:hover { border-color: var(--primary); color: var(--primary); }
        .drive-btn.connected { border-color: #00cc66; color: #00cc66; }

        .sync-indicator {
            text-align: center;
            font-size: 0.75em;
            margin-top: 8px;
            opacity: 0.6;
            min-height: 18px;
        }

        /* CONTEÚDO */
        .main-content { margin-left: 290px; padding: 40px; width: calc(100% - 330px); }
        .section { display: none; animation: fadeIn 0.5s ease; }
        .section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .project-title { background: transparent; font-size: 2.2em; font-weight: 800; color: var(--primary); border: none; border-bottom: 2px solid var(--primary); width: 100%; margin-bottom: 30px; outline: none; }

        .card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); padding: 25px; border-radius: 20px; margin-bottom: 25px; }

        h3 { color: var(--primary); font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        .cost-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr; gap: 15px; align-items: center; margin-bottom: 12px; }

        input[type="text"], input[type="number"], input[type="date"] { 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid var(--glass-border); 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 1em;
            width: 100%;
            box-sizing: border-box;
        }
