<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Hub - Pro System</title>
    <style>
        :root { 
            --primary: #ffcc00; 
            --primary-glow: rgba(255, 204, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg: #0a0b10;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle at top right, #1a1c2c, var(--bg)); 
            color: #e0e0e0; margin: 0; display: flex; min-height: 100vh; overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar { 
            width: 260px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border); padding: 30px 20px; 
            position: fixed; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; z-index: 100;
        }
        .sidebar h2 { color: var(--primary); text-transform: uppercase; letter-spacing: 3px; font-size: 1.1em; margin-bottom: 40px; text-shadow: 0 0 10px var(--primary-glow); }
        
        .nav-item { 
            cursor: pointer; padding: 15px; margin-bottom: 10px; border-radius: 10px;
            transition: 0.3s; border: 1px solid transparent; font-weight: bold; font-size: 0.9em;
        }
        .nav-item:hover, .nav-item.active { 
            background: var(--glass); border: 1px solid var(--primary); color: var(--primary); box-shadow: 0 0 15px var(--primary-glow);
        }

        .drive-section { margin-top: auto; padding-bottom: 20px; }
        .drive-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass); color: #e0e0e0; cursor: pointer; font-size: 0.85em; transition: 0.3s;
        }
        .drive-btn.connected { border-color: #00cc66; color: #00cc66; }
        .sync-indicator { text-align: center; font-size: 0.7em; margin-top: 8px; opacity: 0.6; min-height: 15px; }
        
        /* MAIN CONTENT */
        .main-content { margin-left: 280px; padding: 40px; width: calc(100% - 320px); max-width: 1000px; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .project-title { background: transparent; font-size: 2.2em; font-weight: 800; color: var(--primary); border: none; border-bottom: 2px solid var(--primary); width: 100%; margin-bottom: 30px; outline: none; }
